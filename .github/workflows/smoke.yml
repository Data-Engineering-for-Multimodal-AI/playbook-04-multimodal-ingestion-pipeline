name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    # Sample data, the API, every pipeline step and run_pipeline.py (CPU, no network)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Smoke test
        run: make smoke
      - name: Printed install path (pip install -r requirements.txt), whole pipeline
        run: |
          uv venv --seed --python ${{ matrix.python-version }} /tmp/pipenv
          /tmp/pipenv/bin/python -m pip install -q -r requirements.txt
          /tmp/pipenv/bin/python ByteEats/run_pipeline.py
          cat qa_results/ORD1001_quality_report.json
